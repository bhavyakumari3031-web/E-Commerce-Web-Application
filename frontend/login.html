<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | LumaCart</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="center-page">
  <div class="auth-card">
    <a class="brand" href="index.html"><span>✦</span> LumaCart</a>
    <span class="eyebrow">WELCOME BACK</span>
    <h1>Sign in</h1>
    <p class="muted">Access your cart, orders and account.</p>
    <form id="loginForm" class="form">
      <label>Email<input id="email" class="input" type="email" required placeholder="you@example.com"></label>
      <label>Password<input id="password" class="input" type="password" required placeholder="••••••••"></label>
      <button class="btn full" type="submit">Sign In</button>
      <div id="message" class="message"></div>
    </form>
    <p class="switch">New here? <a href="register.html">Create an account</a></p>
    <div class="demo-box"><strong>Demo accounts</strong><br>User: user@shop.com / User@123<br>Admin: admin@shop.com / Admin@123</div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
